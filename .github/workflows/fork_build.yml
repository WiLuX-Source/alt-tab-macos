name: Production Build

on:
  workflow_dispatch:

env:
  APP_NAME: AltTab
  VERSION: 10.12.0
  XCODE_BUILD_PATH: DerivedData/Build/Products/Release

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_PATH="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Fill build placeholders
        run: |
          set -euo pipefail
          sed -i '' -e "s/#VERSION#/$VERSION/g" Info.plist
          sed -i '' -e "s/#FEEDBACK_TOKEN#/fork-build/g" Info.plist
          sed -i '' -e "s/#APPCENTER_SECRET#/fork-build/g" Info.plist

      - name: Set up ad-hoc signing
        run: scripts/codesign/setup_ci_pr.sh

      - name: Build app
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace alt-tab-macos.xcworkspace \
            -scheme Release \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="Local Self-Signed" \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none --deep" \
            ENABLE_HARDENED_RUNTIME=NO
          file "$XCODE_BUILD_PATH/$APP_NAME.app/Contents/MacOS/$APP_NAME"

      - name: Package app
        run: |
          set -euo pipefail
          cd "$XCODE_BUILD_PATH"
          ditto -c -k --keepParent "$APP_NAME.app" "$APP_NAME-$VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: AltTab-${{ env.VERSION }}
          path: ${{ env.XCODE_BUILD_PATH }}/AltTab-${{ env.VERSION }}.zip
          if-no-files-found: error
